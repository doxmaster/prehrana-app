# Provjera koda na svaki push.
#
# Objavu radi Cloudflare (vidi cloudflare.yml i Cloudflareovu vezu na Git).
# Ovdje se samo provjerava da kod stoji: lint, svi testovi i da se gradnja
# uopće može složiti.
#
# Ranije je ovaj workflow objavljivao na GitHub Pages. To je ugašeno jer su
# dvije žive adrese značile DVA ODVOJENA skupa podataka: tko otvori staru,
# upisuje u nešto što se nigdje ne vidi i ne može se sinkronizirati.
name: Provjera koda

on:
  push:
    branches: [master, modernizacija]
  workflow_dispatch:

permissions:
  contents: read

# Jedna provjera odjednom; novi push otkazuje onu koja je još u tijeku.
concurrency:
  group: provjera
  cancel-in-progress: true

jobs:
  provjera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalacija
        run: npm ci

      - name: Provjera koda
        run: npx eslint .

      - name: Testovi
        run: npx vitest run

      # Gradi se bez GITHUB_PAGES: provjerava se da build prolazi, ne pravi se
      # izdanje. Google ključevi ovdje ne trebaju — bez njih se gradi jednako.
      - name: Gradnja
        run: npm run build
        env:
          # Kljucevi Google prijave. Javni su po naravi (vide se u kodu svake
          # web aplikacije) i cuvaju ih dopustene adrese, ne tajnost — zato
          # `vars`, a ne `secrets`. Bez njih aplikacija radi, samo bez
          # zajednicke obitelji.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          # Adrese kojima je dopusteno uskladivanje, odvojene zarezom. Prazno =
          # svi koje Google pusti. Prava brava je popis testnih korisnika u
          # Google konzoli; ovo je da nepozvani dobije razumljivu poruku.
          VITE_GOOGLE_DOZVOLJENI: ${{ vars.GOOGLE_DOZVOLJENI }}
